name: Daily edition
on:
  schedule:
    # 06:30 Oslo: 04:30 UTC in summer, 05:30 UTC in winter.
    - cron: '30 4,5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and render
        run: python collect.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Commit new edition
        run: |
          git add index.html editions/
          if git diff --cached --quiet; then
            echo 'No new edition.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish daily edition"
          git push
  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Package public files
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
